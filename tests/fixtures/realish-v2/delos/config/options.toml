schema_version = 2

[option."delos.build.profile"]
type = "enum"
default = "debug"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Build profile"
help = "Delos public artifact profile selected by the host build."
tags = ["build", "profile"]
values = ["debug", "release", "verify"]

[option."delos.build.output_root"]
type = "path"
default = "build/target"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Output root"
help = "User-facing Delos artifact output root."
tags = ["build", "artifact"]

[option."delos.generated.config_root"]
type = "path"
default = "build/generated/config/delos"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Generated config root"
help = "Build-relative root for Confit generated configuration artifacts."
tags = ["generated", "config"]

[option."delos.generated.config_header"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Generate config.h"
help = "Emit the C configuration header consumed by compile-time gates."
tags = ["generated", "header"]

[option."delos.generated.reports"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Generate reports"
help = "Emit deterministic JSON and text reports for review and audit."
tags = ["generated", "report"]

[option."delos.generated.cmake_fragment"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "experimental"
emit = ["header", "cmake", "qstar"]
prompt = "Generate CMake fragment"
help = "Emit a build-tree CMake fragment for future Delos integration."
tags = ["generated", "cmake"]

[option."delos.generated.qstar_manifest"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "experimental"
emit = ["header", "cmake", "qstar"]
prompt = "Generate QStar manifest"
help = "Emit a build-tree QStar manifest for future Delos integration."
tags = ["generated", "qstar"]

[option."delos.profile.debug"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "internal"
emit = ["header", "cmake", "qstar"]
help = "Internal marker for debug-oriented profile resolution."
tags = ["profile", "debug"]

[option."delos.profile.release"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "internal"
emit = ["header", "cmake", "qstar"]
help = "Internal marker for release-boundary profile resolution."
tags = ["profile", "release"]

[option."delos.internal.debug_surface"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-debug"
since = "0.1.0"
stability = "internal"
emit = ["header", "cmake", "qstar"]
help = "Hidden aggregate marker for debug-only DDC/DSH surfaces."
tags = ["debug", "internal"]

[option."delos.debug.ddc"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-debug"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Enable Delos Debug Console"
help = "Include the DDC parser and byte-stream debug console support."
tags = ["debug", "ddc", "development"]

[option."delos.debug.dsh"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-debug"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Enable Delos Shell"
help = "Include the DSH prompt and read-only command table on top of DDC."
tags = ["debug", "dsh", "sim"]

[option."delos.debug.observability"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-debug"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Enable DDC observability"
help = "Expose trace, tasks, DCG, inventory, HAL, and fault snapshots through DDC."
tags = ["debug", "observability"]

[option."delos.debug.release_diagnostic_dump"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-debug"
since = "0.1.0"
stability = "experimental"
emit = ["header", "cmake", "qstar"]
prompt = "Release diagnostic dump"
help = "Allow a one-way diagnostic marker without enabling DDC command input."
tags = ["debug", "release"]

[option."delos.sim.hosted_stdio"]
type = "bool"
default = false
write_domain = "profile"
owner = "delos-sim"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Hosted stdio DDC transport"
help = "Use hosted stdin/stdout as the simulator DDC byte stream."
tags = ["sim", "transport", "stdio"]

[option."delos.dcg.enabled"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos-runtime"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Enable DCG"
help = "Build the Delos DCG request and completion runtime."
tags = ["runtime", "dcg"]

[option."delos.scheduler.task_slots"]
type = "uint"
default = 16
write_domain = "profile"
owner = "delos-runtime"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Scheduler task slots"
help = "Static scheduler task slot capacity."
tags = ["runtime", "scheduler"]
range = { min = 1, max = 128 }

[option."delos.scheduler.dispatch_window_ticks"]
type = "uint"
default = 1000
write_domain = "profile"
owner = "delos-runtime"
since = "0.1.0"
stability = "experimental"
emit = ["header", "cmake", "qstar"]
prompt = "Dispatch window ticks"
help = "Default scheduler dispatch accounting window in Delos ticks."
tags = ["runtime", "scheduler", "time"]
range = { min = 1, max = 1000000 }

[option."delos.trace.capacity"]
type = "uint"
default = 64
write_domain = "profile"
owner = "delos-runtime"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Trace ring capacity"
help = "Trace ring event capacity used by debug and test fixtures."
tags = ["runtime", "trace", "observability"]
range = { min = 1, max = 4096 }

[option."delos.hal.device_inventory"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos-hal"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Board device inventory"
help = "Compile board-owned HAL device inventory tables."
tags = ["hal", "board", "inventory"]

[option."delos.memory.flash_origin"]
type = "hex"
default = 0
write_domain = "profile"
owner = "delos-board"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Flash origin"
help = "Target flash or image load origin."
tags = ["target", "memory"]
range = { min = 0, max = 4294967295 }

[option."delos.target.kind"]
type = "enum"
default = "sim:dsh"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Target kind"
help = "User-facing Delos target surface."
tags = ["target"]
values = ["sim:dsh", "qemu:mps2-an500", "renode:nucleo-h753zi", "renode:stm32f4-discovery", "renode:stm32f7-discovery"]

[option."delos.target.arch"]
type = "enum"
default = "host"
write_domain = "profile"
owner = "delos-arch"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Target architecture"
help = "Architecture lane selected by the target."
tags = ["target", "arch"]
values = ["host", "armv7m"]

[option."delos.target.board"]
type = "enum"
default = "host-sim"
write_domain = "profile"
owner = "delos-board"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Target board"
help = "Board or simulator fixture selected by the target."
tags = ["target", "board"]
values = ["host-sim", "qemu-mps2-an500", "nucleo-h753zi", "stm32f4-discovery", "stm32f7-discovery"]

[option."delos.target.cpu"]
type = "enum"
default = "host"
write_domain = "profile"
owner = "delos-arch"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Target CPU"
help = "CPU profile selected by the target."
tags = ["target", "cpu"]
values = ["host", "cortex-m3", "cortex-m4", "cortex-m7"]

[option."delos.target.output_name"]
type = "string"
default = "delos"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Output name"
help = "Primary target artifact name."
tags = ["target", "artifact"]

[option."delos.target.artifact_entry"]
type = "path"
default = "build/target/delos"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Convenience artifact entry"
help = "Convenience path for the primary user-facing artifact."
tags = ["target", "artifact"]

[option."delos.target.claim_level"]
type = "enum"
default = "host-simulator"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Target claim level"
help = "Claim level exported to build selection manifests."
tags = ["target", "claim"]
values = ["host-simulator", "qemu-smoke", "qemu-system", "renode-probe"]

[option."delos.toolchain.id"]
type = "enum"
default = "host"
write_domain = "profile"
owner = "delos-build"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Toolchain"
help = "Build toolchain selected by the target."
tags = ["target", "toolchain"]
values = ["host", "arm-none-eabi"]

[option."delos.board.family"]
type = "enum"
default = "host"
write_domain = "profile"
owner = "delos-board"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Board family"
help = "Board family selected by the target."
tags = ["target", "board"]
values = ["host", "arm-mps2", "stm32h7"]

[option."delos.board.objects"]
type = "string"
default = "//src/board/host/sim:board_objects"
write_domain = "profile"
owner = "delos-board"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Board object labels"
help = "Semicolon-separated QStar object labels selected by the board."
tags = ["target", "board", "qstar"]

[option."delos.board.include_dirs"]
type = "path"
default = "src/board/host/sim"
write_domain = "profile"
owner = "delos-board"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Board include directories"
help = "Semicolon-separated include directories selected by the board."
tags = ["target", "board", "include"]

[option."delos.board.linker_script"]
type = "path"
default = "linker/host-sim.ld"
write_domain = "profile"
owner = "delos-board"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Board linker script"
help = "Linker script selected by the board."
tags = ["target", "board", "linker"]
