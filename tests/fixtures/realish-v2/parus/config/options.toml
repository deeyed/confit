schema_version = 2

[option."parus.policy.hardware_first"]
type = "bool"
default = true
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Hardware-first policy"
help = "Keep RPi5 hardware and QEMU AArch64 as first-class validation lanes."
tags = ["policy", "hardware"]

[option."parus.policy.keep_v1_reference_only"]
type = "bool"
default = true
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Keep Kairon v1 reference-only"
help = "Treat Kairon v1 as reference material rather than active source."
tags = ["policy", "migration"]

[option."parus.boot.path"]
type = "enum"
default = "direct-dtb"
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Boot handoff path"
help = "Primary handoff source that xibalba validates."
tags = ["boot", "handoff"]
values = ["direct-dtb", "ribon-lbpb", "firmware-direct"]

[option."parus.boot.direct_dtb"]
type = "bool"
default = false
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Direct DTB handoff"
help = "Primary handoff pointer is a DTB blob candidate."
tags = ["boot", "dtb"]

[option."parus.boot.ribon_lbpb"]
type = "bool"
default = false
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Ribon LBPB handoff"
help = "Primary handoff pointer is a Ribon LBPB candidate."
tags = ["boot", "ribon", "lbpb"]

[option."parus.boot.allow_direct_dtb_fallback"]
type = "bool"
default = false
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Allow direct DTB fallback"
help = "Allow independently supplied DTB fallback when the primary path is Ribon LBPB."
tags = ["boot", "dtb", "fallback"]

[option."parus.boot.early_serial"]
type = "bool"
default = true
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Early serial diagnostics"
help = "Plan early UART marker diagnostics during bring-up."
tags = ["boot", "serial", "diagnostics"]

[option."parus.boot.stage_limit"]
type = "enum"
default = "eb2"
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "experimental"
emit = ["header", "cmake", "qstar"]
prompt = "Validated boot stage limit"
help = "Highest expected smoke-test marker for this profile."
tags = ["boot", "smoke"]
values = ["xibalba", "eb2", "kernel-main", "idle"]

[option."parus.boot.image_load_address"]
type = "hex"
default = 524288
write_domain = "profile"
owner = "parus-boot"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Image load address"
help = "Raw AArch64 image load address used by the selected lane."
tags = ["boot", "image"]
range = { min = 0, max = 4294967295 }

[option."parus.config.profile"]
type = "enum"
default = "qemu-virt-aarch64"
write_domain = "profile"
owner = "parus-config"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Config profile"
help = "Board profile that selects Parus source config inputs."
tags = ["config", "profile"]
values = ["qemu-virt-aarch64", "rpi5", "qemu-amd64"]

[option."parus.config.defconfig"]
type = "path"
default = "configs/boards/qemu-virt-aarch64/defconfig"
write_domain = "profile"
owner = "parus-config"
since = "0.1.0"
stability = "stable"
emit = ["header", "cmake", "qstar"]
prompt = "Defconfig"
help = "Hand-written board defconfig consumed by the resolver."
tags = ["config", "defconfig"]

[option."parus.config.output_dir"]
