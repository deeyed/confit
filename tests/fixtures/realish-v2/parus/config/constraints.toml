schema_version = 2

[[constraint]]
id = "parus.boot.ribon_not_direct"
when = "enabled(parus.boot.ribon_lbpb)"
require = "!enabled(parus.boot.direct_dtb)"
message = "Ribon LBPB conflicts with direct DTB."

[[constraint]]
id = "parus.boot.fallback_ribon"
when = "enabled(parus.boot.allow_direct_dtb_fallback)"
require = "enabled(parus.boot.ribon_lbpb)"
message = "Direct DTB fallback requires Ribon LBPB."

[[constraint]]
id = "parus.kcg.binding_core"
when = "enabled(parus.kcg.capability_binding)"
require = "enabled(parus.kcg.core_model)"
message = "KCG capability binding requires the core model."

[[constraint]]
id = "parus.executor.rt_core"
when = "enabled(parus.executor.rt_executor)"
require = "enabled(parus.kcg.core_model)"
message = "RT executor requires the KCG core model."

[[constraint]]
id = "parus.executor.delos_rt"
when = "enabled(parus.executor.delos_target)"
require = "enabled(parus.executor.rt_executor)"
message = "Delos target requires the RT executor."

[[constraint]]
id = "parus.arch.amd64_not_arm64"
when = "enabled(parus.arch.amd64)"
require = "!enabled(parus.arch.arm64)"
message = "AMD64 conflicts with AArch64."

[[constraint]]
id = "parus.board.qemu_arm64"
when = "enabled(parus.board.qemu_virt_aarch64)"
require = "enabled(parus.arch.arm64)"
message = "QEMU AArch64 requires AArch64."

[[constraint]]
id = "parus.board.rpi5_arm64"
when = "enabled(parus.board.rpi5)"
require = "enabled(parus.arch.arm64)"
message = "RPi5 requires AArch64."

[[constraint]]
id = "parus.board.rpi5_not_qemu"
when = "enabled(parus.board.rpi5)"
require = "!enabled(parus.board.qemu_virt_aarch64)"
message = "RPi5 conflicts with QEMU AArch64."

[[constraint]]
id = "parus.board.qemu_amd64_arch"
when = "enabled(parus.board.qemu_amd64)"
require = "enabled(parus.arch.amd64)"
message = "QEMU AMD64 requires AMD64."

[[constraint]]
id = "parus.board.qemu_amd64_not_arm_qemu"
when = "enabled(parus.board.qemu_amd64)"
require = "!enabled(parus.board.qemu_virt_aarch64)"
message = "QEMU AMD64 conflicts with QEMU AArch64."

[[constraint]]
id = "parus.board.qemu_amd64_not_rpi5"
when = "enabled(parus.board.qemu_amd64)"
require = "!enabled(parus.board.rpi5)"
message = "QEMU AMD64 conflicts with RPi5."
