[compat]
name = "parus-delos-forbid"
schema_version = 2

[projects]
parus = "../parus"
delos = "../delos"

[[constraint]]
id = "parus-delos.transport-forbid"
when = "enabled(parus::parus.driver.delos_link)"
forbid = "enabled(delos::delos.driver.transport)"
message = "이 fixture는 enabled Delos transport를 금지합니다."
