schema_version = 2

[option."parus.target.cpu"]
type = "string"
default = "cortex-m7"
write_domain = "profile"
owner = "parus"
since = "0.2.0"
stability = "stable"

[option."parus.target.board"]
type = "string"
default = "nucleo-h753zi"
write_domain = "profile"
owner = "parus"
since = "0.2.0"
stability = "stable"

[option."parus.driver.delos_link"]
type = "bool"
default = true
write_domain = "profile"
owner = "parus"
since = "0.2.0"
stability = "stable"

[option."parus.compat.capacity"]
type = "uint"
default = 4096
range = { min = 0, max = 8192 }
write_domain = "profile"
owner = "parus"
since = "0.2.0"
stability = "stable"

[option."parus.linker.kind"]
type = "string"
default = "gnu-ld"
write_domain = "profile"
owner = "parus"
since = "0.2.0"
stability = "stable"
