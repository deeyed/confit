schema_version = 2

[option."delos.target.cpu"]
type = "string"
default = "cortex-m7"
write_domain = "profile"
user_override = true
owner = "delos"
since = "0.2.0"
stability = "stable"

[option."delos.target.board"]
type = "string"
default = "nucleo-h753zi"
write_domain = "profile"
owner = "delos"
since = "0.2.0"
stability = "stable"

[option."delos.driver.transport"]
type = "bool"
default = true
write_domain = "profile"
owner = "delos"
since = "0.2.0"
stability = "stable"

[option."delos.memory.capacity"]
type = "uint"
default = 4096
range = { min = 0, max = 8192 }
write_domain = "profile"
owner = "delos"
since = "0.2.0"
stability = "stable"

[option."delos.linker.kind"]
type = "string"
default = "gnu-ld"
write_domain = "profile"
owner = "delos"
since = "0.2.0"
stability = "stable"
