schema_version = 2

[menu."v2tui.core"]
prompt = "Core"
order = 10

[menu."v2tui.tuning"]
prompt = "Tuning"
order = 20

[menu."v2tui.advanced"]
prompt = "Advanced"
parent = "v2tui.tuning"
order = 10

[option."v2tui.enabled"]
type = "bool"
default = false
write_domain = "profile"
prompt = "Enable V2 Feature"
help = "Enables the V2-only editor fixture."
menu = "v2tui.core"
tags = ["core", "toggle"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.mode"]
type = "enum"
values = ["sim", "hardware"]
default = "sim"
write_domain = "profile"
prompt = "Execution Mode"
help = "An enum selection in the profile transaction."
menu = "v2tui.core"
tags = ["core", "enum"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.capacity"]
type = "uint"
default = 4
range = { min = 1, max = 64 }
write_domain = "profile"
prompt = "Trace Capacity"
help = "An unsigned range checked while the edit dialog is open."
menu = "v2tui.tuning"
tags = ["trace", "capacity"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.paths"]
type = "path_list"
default = ["src", "include"]
write_domain = "profile"
prompt = "Search Paths"
help = "A typed path list represented by a TOML array."
menu = "v2tui.tuning"
tags = ["path", "list"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.advanced_flag"]
type = "bool"
default = false
write_domain = "profile"
prompt = "Advanced Flag"
help = "Visible only after the V2 feature is enabled."
menu = "v2tui.advanced"
visible_if = "v2tui.enabled == true"
tags = ["advanced"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.derived"]
type = "bool"
write_domain = "computed"
computed = "v2tui.enabled"
prompt = "Derived Feature State"
help = "A computed read-only option."
menu = "v2tui.core"
tags = ["computed"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.backend_a"]
type = "bool"
default = false
write_domain = "profile"
prompt = "Backend A"
menu = "v2tui.advanced"
tags = ["choice"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[option."v2tui.backend_b"]
type = "bool"
default = false
write_domain = "profile"
prompt = "Backend B"
menu = "v2tui.advanced"
tags = ["choice"]
owner = "confit-tests"
since = "0.2.0"
stability = "stable"

[choice."v2tui.backend"]
member_type = "bool"
members = ["v2tui.backend_a", "v2tui.backend_b"]
cardinality = "zero-or-one"

