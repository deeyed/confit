schema_version = 2

[option."eval.base"]
type = "uint"
default = 2
range = { min = 0, max = 100 }
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"

[option."eval.conditional"]
type = "uint"
default = 1
range = { min = 0, max = 100 }
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"

[[option."eval.conditional".defaults]]
when = "eval.base == 0x2"
value = 5
priority = 10

[[option."eval.conditional".defaults]]
when = "eval.base == 0x2"
value = 9
priority = 100

[option."eval.requested"]
type = "uint"
default = 7
range = { min = 0, max = 100 }
write_domain = "profile"
user_override = true
owner = "confit"
since = "0.2.0"
stability = "stable"

[[option."eval.requested".defaults]]
when = "eval.base == 0x2"
value = 13
priority = 100

[option."eval.total"]
type = "uint"
range = { min = 0, max = 100 }
write_domain = "computed"
computed = "eval.base + eval.conditional"
owner = "confit"
since = "0.2.0"
stability = "stable"
