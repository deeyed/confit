schema_version = 2

[option."choice.first"]
type = "bool"
default = false
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"

[option."choice.second"]
type = "bool"
default = false
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"

[choice."choice.mode"]
member_type = "bool"
members = ["choice.first", "choice.second"]
cardinality = "exactly-one"

[[choice."choice.mode".defaults]]
when = "true"
member = "choice.first"
priority = 10

[[choice."choice.mode".defaults]]
when = "!false"
member = "choice.second"
priority = 10
