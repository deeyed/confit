schema_version = 2

[option."availability.hidden"]
type = "bool"
default = true
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"
visible_if = "false"

[option."availability.disabled"]
type = "bool"
default = false
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"
available_if = "false"

[option."availability.optional"]
type = "uint"
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"
available_if = "false"

[[option."availability.optional".defaults]]
when = "false"
value = 1
priority = 1

[option."availability.backend.a"]
type = "bool"
default = false
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"

[option."availability.backend.b"]
type = "bool"
default = false
write_domain = "profile"
owner = "confit"
since = "0.2.0"
stability = "stable"

[choice."availability.backend"]
member_type = "bool"
members = ["availability.backend.a", "availability.backend.b"]
cardinality = "exactly-one"
visible_if = "false"

[[choice."availability.backend".defaults]]
when = "true"
member = "availability.backend.a"
priority = 100

[[choice."availability.backend".defaults]]
when = "true"
member = "availability.backend.b"
